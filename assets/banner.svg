<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="touchpa(inte)d - Zero-pressure touchpad gesture launcher">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#15181F"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <linearGradient id="brushGrad" x1="0%" y1="50%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#00B894" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#46FFC8"/>
      <stop offset="75%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#46FFC8" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="underlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#46FFC8" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.1"/>
    </linearGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.15" fill="#232A3B"/>
    </pattern>

    <filter id="neonGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Card -->
  <rect x="6" y="6" width="868" height="248" rx="22" fill="url(#bgGrad)" stroke="#2A3244" stroke-width="2"/>
  <rect x="18" y="18" width="844" height="224" rx="16" fill="url(#dotGrid)" opacity="0.85"/>

  <!-- Subtle Touchpad Corner Badge -->
  <g transform="translate(40, 34)">
    <rect x="0" y="0" width="136" height="28" rx="14" fill="#182232" stroke="#2D3C56" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#46FFC8" filter="url(#neonGlow)"/>
    <text x="28" y="18.5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#A9B7D0" letter-spacing="0.6">WINDOWS 10 / 11 HID</text>
  </g>

  <!-- Organic Neon Brush Stroke Background Swoosh -->
  <g filter="url(#neonGlow)" opacity="0.9">
    <path d="M 110 155 C 210 170, 315 128, 435 124 C 540 120, 620 148, 748 92 C 776 80, 798 68, 816 54"
          fill="none" stroke="url(#brushGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 165 162 C 265 168, 355 135, 468 130 C 570 126, 650 152, 772 95"
          fill="none" stroke="#46FFC8" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 520 104 C 605 94, 685 112, 794 74"
          fill="none" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Paint Brush Tip & Neon Splatter Droplets -->
  <g fill="#46FFC8" filter="url(#neonGlow)">
    <circle cx="792" cy="64" r="4.5" opacity="0.9"/>
    <circle cx="818" cy="48" r="3" opacity="0.75"/>
    <circle cx="755" cy="118" r="2.8" fill="#00D4FF" opacity="0.8"/>
    <circle cx="132" cy="148" r="2.5" opacity="0.6"/>
    <circle cx="672" cy="70" r="2.2" opacity="0.55"/>
  </g>

  <!-- Stylized Gesture 'C' Preview Card on the Right -->
  <g transform="translate(715, 118)">
    <rect x="0" y="0" width="112" height="92" rx="14" fill="#0B0E14" stroke="#2D3C56" stroke-width="1.5"/>
    <path d="M 76 26 C 58 14, 34 22, 30 46 C 26 70, 56 78, 76 66"
          fill="none" stroke="#46FFC8" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlow)"/>
    <circle cx="76" cy="66" r="4.5" fill="#C4FFF0"/>
  </g>

  <!-- Main Wordmark: touchpa(inte)d -->
  <g transform="translate(72, 134)">
    <text x="0" y="0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
      <tspan fill="#EBF0FA">touchpa</tspan><tspan fill="#46FFC8" filter="url(#neonGlow)">(inte)</tspan><tspan fill="#EBF0FA">d</tspan>
    </text>

    <!-- Brush Underline under (inte)d -->
    <path d="M 248 18 C 305 24, 385 12, 462 17 C 478 18, 492 15, 502 12"
          fill="none" stroke="url(#underlineGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M 255 17 C 315 22, 390 13, 470 16"
          fill="none" stroke="#B6FFEE" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Subtitles -->
  <text x="74" y="186" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#B8C4DC">
    Turn your touchpad into a zero-pressure gesture canvas
  </text>
  <text x="74" y="212" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#7D8CA8">
    2-parmak dokunuşla aç · Sıfır baskıyla harf çiz · Anında başlat · Rust + Win32 Raw HID
  </text>
</svg>
