<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="touchpa(inte)d - Windows Precision Touchpad Gesture Launcher">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#15181F"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <linearGradient id="brushGrad" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#46FFC8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#46FFC8" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.15" fill="#232A3B"/>
    </pattern>

    <filter id="neonGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Card -->
  <rect x="6" y="6" width="868" height="248" rx="22" fill="url(#bgGrad)" stroke="#2A3244" stroke-width="2"/>
  <rect x="18" y="18" width="844" height="224" rx="16" fill="url(#dotGrid)" opacity="0.85"/>

  <!-- Top Badges inside Banner -->
  <g transform="translate(68, 34)">
    <rect x="0" y="0" width="148" height="26" rx="13" fill="#162030" stroke="#2D3C56" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#46FFC8" filter="url(#neonGlow)"/>
    <text x="27" y="17.5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B8C7E0" letter-spacing="0.7">WINDOWS 10 / 11 x64</text>

    <rect x="158" y="0" width="152" height="26" rx="13" fill="#162030" stroke="#2D3C56" stroke-width="1"/>
    <text x="234" y="17.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#46FFC8" letter-spacing="0.6">RUST · ZERO CRATES</text>
  </g>

  <!-- Clean Non-Overlapping Neon Paint Brush Swoosh (Sweeps from underline to top-right) -->
  <g filter="url(#neonGlow)">
    <path d="M 310 150 C 415 156, 510 146, 595 112 C 642 93, 675 70, 704 46"
          fill="none" stroke="url(#brushGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 318 150 C 420 155, 515 144, 602 108 C 646 90, 678 68, 698 52"
          fill="none" stroke="#C8FFF0" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M 555 132 C 608 118, 650 96, 690 68"
          fill="none" stroke="#00D4FF" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Paint Splatter Droplets -->
  <g fill="#46FFC8" filter="url(#neonGlow)">
    <circle cx="712" cy="40" r="4" opacity="0.9"/>
    <circle cx="728" cy="54" r="2.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="672" cy="52" r="2.3" opacity="0.7"/>
    <circle cx="635" cy="112" r="2.6" fill="#00D4FF" opacity="0.75"/>
  </g>

  <!-- Stylized Gesture HUD Preview Card on the Right -->
  <g transform="translate(724, 82)">
    <rect x="0" y="0" width="114" height="114" rx="16" fill="#0B0E14" stroke="#2F3F5C" stroke-width="1.6"/>
    <line x1="14" y1="24" x2="100" y2="24" stroke="#1E2738" stroke-width="1"/>
    <circle cx="22" cy="14" r="3" fill="#46FFC8"/>
    <circle cx="96" cy="14" r="3" fill="#EB5F5F"/>
    <path d="M 78 44 C 56 30, 32 42, 30 68 C 28 94, 58 102, 80 88"
          fill="none" stroke="#46FFC8" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
    <circle cx="80" cy="88" r="4.5" fill="#D8FFF4"/>
  </g>

  <!-- Main Wordmark: touchpa(inte)d -->
  <g transform="translate(68, 130)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
      <tspan fill="#F0F4FC">touchpa</tspan><tspan fill="#46FFC8" filter="url(#neonGlow)">(inte)</tspan><tspan fill="#F0F4FC">d</tspan>
    </text>
  </g>

  <!-- Subtitles -->
  <text x="70" y="186" font-family="system-ui, sans-serif" font-size="17.5" font-weight="600" fill="#C2CEE5">
    Zero-Pressure Touchpad Gesture Launcher for Windows 10/11
  </text>
  <text x="70" y="212" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#8292B0">
    2-parmak dokunuşla aç · Sıfır baskıyla harf çiz · Anında başlat · ~230 KB Native Rust + Raw HID
  </text>
</svg>
