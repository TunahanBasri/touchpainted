[package]
name = "touchpainted"
version = "1.0.1"
edition = "2024"
authors = ["TunahanBasri"]
description = "Zero-dependency Windows 10/11 Precision Touchpad gesture launcher — draw letters on your laptop touchpad to launch apps instantly"
repository = "https://github.com/TunahanBasri/touchpainted"
homepage = "https://github.com/TunahanBasri/touchpainted"
readme = "README.md"
keywords = ["touchpad", "gesture-recognition", "launcher", "windows", "hid"]
categories = ["os::windows-apis", "gui"]
license-file = "LICENSE"
publish = false

[[bin]]
name = "touchpainted"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
